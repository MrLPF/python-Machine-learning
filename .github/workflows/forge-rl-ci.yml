name: ForgeRL CI

on:
  pull_request:
    paths:
      - "ForgeRL/**"
      - ".github/workflows/forge-rl-ci.yml"
  push:
    branches: [master]
    paths:
      - "ForgeRL/**"
      - ".github/workflows/forge-rl-ci.yml"

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ForgeRL/pyproject.toml
      - name: Install CPU dependencies
        working-directory: ForgeRL
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[dev]'
      - name: Compile source tree
        working-directory: ForgeRL
        run: python -m compileall -q src tests scripts
      - name: Core tests
        working-directory: ForgeRL
        run: pytest -q -m 'not distributed'
      - name: Runtime microbenchmark
        working-directory: ForgeRL
        run: python scripts/benchmark_runtime.py --items 20000 --width 64 --slots 32
      - name: M1 mailbox inference microbenchmark
        working-directory: ForgeRL
        run: |
          python scripts/benchmark_m1_inference.py \
            --service-mode mailbox \
            --actors 2 --requests-per-actor 25 --items-per-request 4 \
            --width 16 --max-batch-items 16 --min-batch-items 8
      - name: M1 v1/v2 acceptance correctness smoke
        if: matrix.python-version == '3.12'
        working-directory: ForgeRL
        env:
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: |
          python scripts/benchmark_m1_acceptance.py \
            --actors 2 --requests-per-actor 8 --items-per-request 2 \
            --width 16 --output-size 4 --max-batch-items 8 \
            --v2-min-batch-items 4 --legacy-min-batch-items 1 \
            --request-slots 4 --throughput-gate 0 \
            --output benchmarks/results/m1-acceptance-smoke.json
      - name: M1 mailbox tuning matrix smoke
        if: matrix.python-version == '3.12'
        working-directory: ForgeRL
        env:
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: |
          python scripts/benchmark_m1_tuning_matrix.py \
            --preset smoke --repeats 1 --warmup-repeats 0 \
            --requests-per-actor 8 \
            --output benchmarks/results/m1-tuning-matrix-smoke.json
      - name: Upload M1 acceptance smoke report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: forgerl-m1-acceptance-smoke
          path: ForgeRL/benchmarks/results/m1-acceptance-smoke.json
          if-no-files-found: error
      - name: Upload M1 tuning matrix smoke report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: forgerl-m1-tuning-matrix-smoke
          path: ForgeRL/benchmarks/results/m1-tuning-matrix-smoke.json
          if-no-files-found: error

  distributed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ForgeRL/pyproject.toml
      - name: Install CPU dependencies
        working-directory: ForgeRL
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[dev]'
      - name: Two-process Gloo learner test
        working-directory: ForgeRL
        run: pytest -q -m distributed

  gym-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ForgeRL/pyproject.toml
      - name: Install Gymnasium benchmark dependencies
        working-directory: ForgeRL
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[dev,gym]'
      - name: CartPole environment smoke benchmark
        working-directory: ForgeRL
        run: python scripts/benchmark_env.py --env CartPole-v1 --envs 8 --steps 5000
      - name: Pendulum environment smoke benchmark
        working-directory: ForgeRL
        run: python scripts/benchmark_env.py --env Pendulum-v1 --envs 8 --steps 5000
      - name: M1 PPO learning plumbing smoke
        working-directory: ForgeRL
        env:
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: |
          python scripts/benchmark_m1_learning.py \
            --smoke --seeds 7 \
            --environments CartPole-v1,Pendulum-v1 \
            --device cpu \
            --output benchmarks/results/m1-learning-smoke.json
      - name: Upload M1 learning smoke report
        uses: actions/upload-artifact@v4
        with:
          name: forgerl-m1-learning-smoke
          path: ForgeRL/benchmarks/results/m1-learning-smoke.json
          if-no-files-found: error
