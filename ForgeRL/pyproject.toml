[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-rl"
version = "0.2.0.dev0"
description = "A high-throughput distributed reinforcement-learning runtime built on PyTorch."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "PengFei Liu"}]
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6.0",
  "torch>=2.4",
]

[project.optional-dependencies]
gym = ["gymnasium>=1.0"]
multiagent = ["pettingzoo[mpe]>=1.24"]
dev = [
  "pytest>=8.0",
  "pytest-timeout>=2.3",
  "ruff>=0.6",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
forge_rl = ["profiles/*.yaml"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "distributed: starts a local torch.distributed process group",
  "integration: exercises multiple runtime components",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
